# Bereitstellung bei Render (render.com), Rechenzentrum Frankfurt.
# Render baut das Dockerfile bei jedem Merge in main neu und startet den Dienst.
services:
  - type: web
    name: smartweg
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /anmelden
    # Die Datenbank (PGlite) liegt auf dieser Festplatte und übersteht Neustarts und neue Versionen.
    disk:
      name: daten
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SMARTWEG_DATA_DIR
        value: /data/pglite
      # Optional, für den echten E-Mail-Versand. Leer lassen: Einladungen laufen im Testmodus.
      - key: SMTP_URL
        sync: false
      - key: SMTP_ABSENDER
        sync: false
