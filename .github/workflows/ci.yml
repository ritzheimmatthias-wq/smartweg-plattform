name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SMARTWEG_DATA_DIR: memory://

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skripte prüfen
        run: shellcheck deploy/*.sh
      - name: Wie auf dem Server starten (Caddy mit internem Zertifikat für localhost)
        run: |
          echo "DOMAIN=localhost" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsSk -o /dev/null https://localhost/anmelden && break; sleep 1; done
          # Diese Seite liest aus der Datenbank: 404 heißt, PGlite läuft im Container.
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/einladung/probe)" = 404
      - name: Sicherung erstellen
        run: |
          SMARTWEG_SICHERUNGEN="$RUNNER_TEMP/sicherungen" deploy/sicherung.sh
          tar tzf "$RUNNER_TEMP"/sicherungen/smartweg-*.tar.gz | grep -q PG_VERSION
          for i in $(seq 1 30); do curl -fsSk -o /dev/null https://localhost/anmelden && exit 0; sleep 1; done
          exit 1
      - if: failure()
        run: DOMAIN=localhost docker compose logs || true
